<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pay - Citinet Wi-Fi</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#222}
.box{max-width:420px;margin:24px auto;background:#fff;padding:22px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
input,select,button{width:100%;padding:12px;margin-top:10px;font-size:16px;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}
button{background:#0b5fff;color:#fff;border:none}
#msg{margin-top:16px;font-weight:bold;color:#0a8a3a}
</style>
</head>
<body>
<div class="box">
  <h2>Complete Payment</h2>
  <p id="summary"></p>
  <select id="network">
    <option>MTN Mobile Money</option>
    <option>Vodafone Cash</option>
    <option>AirtelTigo Money</option>
  </select>
  <input id="phone" type="tel" placeholder="Mobile money number">
  <button onclick="pay()">Pay Now</button>
  <div id="msg"></div>
  <p><a href="index.html">← Back to plans</a></p>
</div>
<script>
var p = new URLSearchParams(location.search);
var plan = p.get("plan") || "Daily";
var amount = p.get("amount") || "5";
document.getElementById("summary").textContent = plan + " plan: GH₵" + amount;

function pay(){
  var phone = document.getElementById("phone").value.trim();
  if(phone.length < 10){ alert("Enter a valid phone number"); return; }
  var msg = document.getElementById("msg");
  msg.textContent = "Processing payment...";
  setTimeout(function(){
    msg.textContent = "Payment successful! Your " + plan + " access is now active.";
  }, 2000);
}
</script>
</body>
</html>
