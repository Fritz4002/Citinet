<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pay for Access</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; text-align: center; padding: 40px 20px; }
    input, button { width: 90%; max-width: 300px; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; font-size: 16px; }
    button { background: #38bdf8; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <h1 id="planTitle">Confirm Payment</h1>
  <p id="planDetails"></p>
  <input type="tel" id="phone" placeholder="Mobile Money Number">
  <button onclick="pay()">Pay Now</button>

  <script>
    const params = new URLSearchParams(window.location.search);
    const plan = params.get('plan');
    const amount = params.get('amount');
    document.getElementById('planDetails').innerText = `${plan.toUpperCase()} plan — ${amount} cedis`;

    async function pay() {
      const phone = document.getElementById('phone').value;
      const res = await fetch('/api/initiate-payment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ plan, amount, phone })
      });
      const data = await res.json();
      if (data.paymentUrl) {
        window.location.href = data.paymentUrl; // redirect to mobile money prompt
      } else {
        alert('Payment could not be started. Try again.');
      }
    }
  </script>
</body>
</html>
